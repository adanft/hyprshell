# Config for the throwaway Hyprland that scripts/isolated-session.sh nests
# inside your session. It is not a desktop: it exists so the shell has a
# compositor to reserve an exclusive zone on and to reload, and everything that
# would only cost frames is off.
#
# Nothing here is read by your own Hyprland. Editing it cannot affect your
# session; it can only change what the tests run against.

# One output at a fixed size, so a monitor-dependent layout is reproducible
# rather than whatever the nested window happened to be resized to. An empty
# name matches the single output the Wayland backend creates.
monitor = , 1920x1080@60, 0x0, 1

general {
    border_size = 0
    gaps_in = 0
    gaps_out = 0
}

decoration {
    rounding = 0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# Animations would make the harnesses wait on transitions that prove nothing.
animations {
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0

    # The shell writes theme.conf into this session's config directory. Watching
    # it would reload the compositor on a write the test has not asserted yet;
    # the reload that matters is the explicit `hyprctl reload` the shell runs.
    disable_autoreload = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
